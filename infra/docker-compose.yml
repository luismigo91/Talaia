# Compose de Talaia: cada servicio se construye por separado (target del Dockerfile) y puede
# desplegarse individualmente en Dokploy (ver infra/README.md). En desarrollo se combina con
# docker-compose.override.yml.
#
# Variables (UI de Dokploy → Environment, o .env en local):
#   POSTGRES_PASSWORD (OBLIGATORIA: sin ella Postgres no arranca), AEMET_API_KEY (obligatoria para AEMET),
#   POSTGRES_USER, POSTGRES_DB, OPEN_METEO_INTERVAL_MIN, AEMET_FORECAST_INTERVAL_MIN,
#   AEMET_ALERTS_INTERVAL_MIN, LOG_LEVEL
#
# api y collectors aplican las migraciones al arrancar (idempotente, con advisory lock),
# así que no hay servicio migrate. Dominio: asignarlo en Dokploy al servicio `api`, puerto 3000.
# Redes: no se declaran; Dokploy gestiona la red (y conecta Traefik) al asignar el dominio por UI.

services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talaia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-talaia}
    volumes:
      - talaia-db:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talaia} -d ${POSTGRES_DB:-talaia}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-talaia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-talaia}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: "3000"
      TZ: UTC
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  collectors:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: collectors
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-talaia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-talaia}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AEMET_API_KEY: ${AEMET_API_KEY:-}
      OPEN_METEO_INTERVAL_MIN: ${OPEN_METEO_INTERVAL_MIN:-30}
      AEMET_FORECAST_INTERVAL_MIN: ${AEMET_FORECAST_INTERVAL_MIN:-30}
      AEMET_ALERTS_INTERVAL_MIN: ${AEMET_ALERTS_INTERVAL_MIN:-10}
      TZ: UTC
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  talaia-db:
