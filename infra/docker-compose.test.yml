# Solo base de datos, para tests de integración locales y CI.
services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: talaia
      POSTGRES_PASSWORD: talaia
      POSTGRES_DB: talaia
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talaia -d talaia"]
      interval: 3s
      timeout: 3s
      retries: 20
